groups:
  - name: tradeops-service-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TradeOps service target is down"
          description: "{{ $labels.job }} has been down for at least 1 minute."

  - name: tradeops-api-gateway
    rules:
      - alert: HighGateway5xxRate
        expr: sum(rate(tradeops_api_gateway_http_requests_total{status_code=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API Gateway 5xx rate"
          description: "API Gateway 5xx responses are above the local demo threshold."
      - alert: HighGatewayLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(tradeops_api_gateway_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API Gateway p95 latency"
          description: "API Gateway p95 latency is above 500ms."
      - alert: GatewayUpstreamTimeouts
        expr: sum(increase(tradeops_api_gateway_proxy_upstream_timeouts_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Gateway upstream timeout detected"
          description: "API Gateway recorded upstream proxy timeouts."

  - name: tradeops-event-processing
    rules:
      - alert: EventProcessingFailures
        expr: sum(increase(portfolio_event_processing_attempts_total{status="failed"}[5m])) + sum(increase(surveillance_event_processing_attempts_total{status="failed"}[5m])) + sum(increase(notification_event_processing_attempts_total{status="failed"}[5m])) + sum(increase(audit_event_processing_attempts_total{status="failed"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Event processing failures detected"
          description: "One or more event consumers recorded failed processing attempts."
      - alert: DLQMessagesDetected
        expr: sum(increase(portfolio_events_deadlettered_total[5m])) + sum(increase(surveillance_events_deadlettered_total[5m])) + sum(increase(notification_events_deadlettered_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dead-letter messages detected"
          description: "A non-audit event consumer published messages to a DLQ."
      - alert: EventRetrySpike
        expr: sum(increase(portfolio_events_retried_total[5m])) + sum(increase(surveillance_events_retried_total[5m])) + sum(increase(notification_events_retried_total[5m])) + sum(increase(audit_events_retried_total[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Event retry spike"
          description: "Event retry volume is above the local demo threshold."

  - name: tradeops-order-outbox
    rules:
      - alert: OrderOutboxBacklogHigh
        expr: tradeops_outbox_pending > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Order outbox backlog is high"
          description: "Pending Order Service outbox rows exceeded the local threshold."
      - alert: OrderOutboxOldestPendingTooOld
        expr: tradeops_outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Oldest order outbox event is too old"
          description: "The oldest pending outbox row is older than 5 minutes."
      - alert: OrderOutboxPublishFailuresHigh
        expr: sum(rate(tradeops_outbox_publish_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order outbox publish failures are elevated"
          description: "Order outbox publish errors are above the demo threshold."
      - alert: OrderOutboxTerminalFailuresPresent
        expr: tradeops_outbox_failed > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Order outbox terminal failures present"
          description: "One or more outbox rows require manual inspection."
      - alert: OrderOutboxNoSuccessfulPublishesWithBacklog
        expr: tradeops_outbox_pending > 0 and sum(increase(tradeops_outbox_published_total[10m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Order outbox backlog is not draining"
          description: "Pending outbox rows exist and no successful publishes occurred for 10 minutes."

  - name: tradeops-order-expiry
    rules:
      - alert: OrderExpiryBacklogHigh
        expr: tradeops_order_expiry_due_orders > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Order expiry backlog is high"
          description: "Due DAY/GTD orders exceeded the local expiry threshold."
      - alert: OrderExpiryLagHigh
        expr: tradeops_order_expiry_oldest_due_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order expiry lag is high"
          description: "The oldest due order has been waiting more than 5 minutes."
      - alert: OrderExpiryWorkerErrorsHigh
        expr: sum(rate(tradeops_order_expiry_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order expiry worker errors are elevated"
          description: "The expiry worker error rate is above the demo threshold."
      - alert: OrderExpiryNoProgress
        expr: tradeops_order_expiry_due_orders > 0 and sum(increase(tradeops_orders_expired_total[10m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Order expiry backlog is not draining"
          description: "Due orders exist and no orders expired in the last 10 minutes."
      - alert: OrderExpiryReconciliationErrors
        expr: increase(tradeops_order_expiry_reconciliation_errors_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Order expiry reconciliation errors present"
          description: "Malformed or impossible expiry records require inspection."

  - name: tradeops-surveillance-notification-audit
    rules:
      - alert: SurveillanceAlertSpike
        expr: sum(increase(surveillance_alerts_created_total[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Surveillance alert spike"
          description: "Surveillance alert creation is above the local demo threshold."
      - alert: NotificationDeliveryFailures
        expr: sum(increase(notification_delivery_failures_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Notification delivery failure detected"
          description: "Notification delivery failures increased."
      - alert: WebhookDeliveryFailures
        expr: sum(increase(notification_delivery_attempts_total[5m])) > 0 and sum(increase(notification_delivery_failures_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Webhook or notification delivery failures detected"
          description: "Delivery attempts and failures increased together."
      - alert: AuditIngestionFailures
        expr: sum(increase(audit_events_failed_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Audit ingestion failure detected"
          description: "Audit-service failed to process one or more source events."
      - alert: AuditDLQMessagesDetected
        expr: sum(increase(audit_events_deadlettered_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Audit DLQ messages detected"
          description: "Audit-service published source events to audit.dlq."
